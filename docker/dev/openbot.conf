; Dev: the bind-mounted repo's `pnpm dev` (Vite with hot reload), as openbot-server, on the one port.
[program:openbot]
command=/usr/local/bin/openbot-server
user=openbot-server
directory=/opt/openbot/current
environment=HOME="/home/openbot-server",USER="openbot-server"
autorestart=true
startretries=10
; Only the start script gets the stop signal: it stops pnpm's process tree itself, which signalling the group would break.
stopasgroup=false
killasgroup=false
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
