; The OpenBot server: UI, API and agent runtime, as openbot-server, on the one port.
[program:openbot]
command=/usr/local/bin/openbot-server
user=openbot-server
directory=/home/openbot-server
environment=HOME="/home/openbot-server",USER="openbot-server"
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
