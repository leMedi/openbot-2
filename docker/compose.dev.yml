# Dev environment: the runtime image's `dev` target running this repo with hot reload. Use the root scripts:
#   pnpm dev:up     build and start, wait until the app answers on http://localhost:${OPENBOT_DEV_PORT:-3000}
#   pnpm dev:sh     a shell in the container, as the server's user, in the repo
#   pnpm dev:seed   add sample bots and a group chat
#   pnpm dev:logs   follow the server's output
#   pnpm dev:down   stop (state stays in the volumes)
#   pnpm dev:reset  stop and delete the dev volumes (data, bots' home, node_modules)
# The volumes belong to the `openbot-dev` project, apart from a real install's.
name: openbot-dev

services:
  openbot:
    build:
      context: .
      target: dev
    image: openbot-runtime:dev
    hostname: openbot
    ports:
      - "${OPENBOT_DEV_PORT:-3000}:3000"
      # Sign in with ChatGPT returns the browser to http://127.0.0.1:1455/auth/callback, a port pi listens on during the
      # sign-in; published so the sign-in completes without pasting the URL back.
      - "127.0.0.1:1455:1455"
    environment:
      OPENBOT_PUBLIC_URL: http://localhost:${OPENBOT_DEV_PORT:-3000}
      # pi listens on 127.0.0.1 by default, which the published port can't reach inside the container.
      PI_OAUTH_CALLBACK_HOST: 0.0.0.0
      # Empty means generate one into the data volume; set (≥ 32 characters) in your shell to use your own. Empty also
      # keeps the repo's .env from supplying one, since dotenv never overrides a variable that is set.
      OPENBOT_SECRET_KEY: ${OPENBOT_SECRET_KEY:-}
    volumes:
      - ..:/opt/openbot/current
      - data:/var/lib/openbot
      - home:/home/openbot
      # One volume per workspace package's node_modules, so the host's (macOS) installs are never touched.
      - node-modules:/opt/openbot/current/node_modules
      - webapp-node-modules:/opt/openbot/current/apps/webapp/node_modules
      - desktopd-node-modules:/opt/openbot/current/apps/desktopd/node_modules
      - agent-node-modules:/opt/openbot/current/packages/agent/node_modules
      - api-contract-node-modules:/opt/openbot/current/packages/api-contract/node_modules
      - computer-node-modules:/opt/openbot/current/packages/computer/node_modules
      - core-node-modules:/opt/openbot/current/packages/core/node_modules
      - db-node-modules:/opt/openbot/current/packages/db/node_modules
      - plugins-node-modules:/opt/openbot/current/packages/plugins/node_modules
      - ui-node-modules:/opt/openbot/current/packages/ui/node_modules
      - scripts-node-modules:/opt/openbot/current/scripts/node_modules
      - evals-node-modules:/opt/openbot/current/evals/node_modules
    # Chrome needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb

volumes:
  data:
  home:
  node-modules:
  webapp-node-modules:
  desktopd-node-modules:
  agent-node-modules:
  api-contract-node-modules:
  computer-node-modules:
  core-node-modules:
  db-node-modules:
  plugins-node-modules:
  ui-node-modules:
  scripts-node-modules:
  evals-node-modules:
