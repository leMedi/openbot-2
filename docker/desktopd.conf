; The screen daemon: every bot's screen (Xvfb, Openbox, Chromium, x11vnc), as openbot, apart from the server so screens
; survive its restarts. Its socket is $OPENBOT_DESKTOPD_SOCKET (/run/openbot/desktopd.sock).
[program:openbot-desktopd]
command=/usr/local/bin/openbot-desktopd
user=openbot
directory=/home/openbot
environment=HOME="/home/openbot",USER="openbot"
autorestart=true
startretries=10
; Stopping the daemon stops every screen: it ends their processes itself, then the group catches stragglers.
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
