description: >-
  A plugin tool answers the owner's question directly. The bot uses it before the shell or the browser.
bots:
  - name: Linus
    title: Engineer
world:
  tools:
    - name: github_list_issues
      description: "GitHub plugin: lists a repository's open issues. Arguments: repo (owner/name)."
      result: |
        3 open issues in leMedi/openbot-2:
        #41 Sidebar flickers on resize
        #42 Screen pane stays black after a restart
        #43 Typo in onboarding
script:
  - to: Linus
    text: How many open issues does leMedi/openbot-2 have right now?
assert:
  - tool_called: github_list_issues
  - tool_not_called: bash
  - tool_not_called: use_computer
  - no_silent_answer
rubric:
  - Says there are 3 open issues
faux:
  Linus:
    - call: { github_list_issues: { repo: leMedi/openbot-2 } }
    - send: 3 open right now, the sidebar flicker, the black screen pane after a restart, and an onboarding typo
    - end
